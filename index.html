  <!-- Modal Header -->
  <div id="boardModalHeader" class="px-6 py-4 bg-gradient-to-r from-faith-700 to-faith-600 text-white flex justify-between items-center">
    <div>
      <div class="flex items-center gap-2">
        <span class="px-2 py-0.5 rounded-md bg-white/20 text-[11px] font-bold tracking-wider uppercase" id="boardWeekTag">Week 1</span>
        <span class="text-xs text-sky-100 font-medium" id="boardDateTitle">Friday, Oct 16 • 6:30 PM</span>
      </div>
      <h3 class="text-lg font-bold mt-0.5" id="boardModalTitle">Fellowship Study Board</h3>
    </div>
    <button onclick="closeBoardModal()" class="text-white/70 hover:text-white transition p-1">
      <i class="fa-solid fa-xmark text-xl"></i>
    </button>
  </div>

  <!-- Assigned Leads Banner -->
  <div class="px-6 py-3 bg-faith-50 border-b border-sky-100 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-700">
    <div><span class="font-bold text-amber-700">Leader:</span> <span id="boardLeaderName" class="font-semibold">—</span></div>
    <div><span class="font-bold text-sky-700">Open Prayer:</span> <span id="boardOpenPrayName" class="font-semibold">—</span></div>
    <div><span class="font-bold text-emerald-700">Worship:</span> <span id="boardWorshipName" class="font-semibold">—</span></div>
    <div><span class="font-bold text-purple-700">Close Prayer:</span> <span id="boardClosePrayName" class="font-semibold">—</span></div>
  </div>

  <!-- Modal Body -->
  <div class="p-6 space-y-5 max-h-[70vh] overflow-y-auto">
    <input type="hidden" id="activeBoardDateKey">

    <!-- 1. Topic & Scripture Passage -->
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1 flex items-center gap-1.5">
          <i class="fa-solid fa-bookmark text-rose-500"></i> Topic / Title
        </label>
        <input 
          type="text" 
          id="boardTopicInput" 
          placeholder="e.g. Walking in Faith, Not by Sight" 
          class="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-faith-500 focus:outline-none font-medium"
        />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1 flex items-center gap-1.5">
          <i class="fa-solid fa-quote-left text-faith-600"></i> Key Bible Verse & Passage
        </label>
        <textarea 
          id="boardVerseInput" 
          rows="2" 
          placeholder="e.g. 'Trust in the LORD with all your heart...' - Proverbs 3:5-6" 
          class="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-faith-500 focus:outline-none font-medium"
        ></textarea>
      </div>
    </div>

    <!-- 2. Discussion Notes & Prayer Requests -->
    <div>
      <label class="block text-xs font-bold text-slate-700 uppercase mb-1 flex items-center gap-1.5">
        <i class="fa-solid fa-pen-to-square text-amber-500"></i> Study Notes & Prayer Requests
      </label>
      <textarea 
        id="boardNotesInput" 
        rows="4" 
        placeholder="Type meeting discussion questions, key takeaways, or member prayer requests here..." 
        class="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-faith-500 focus:outline-none"
      ></textarea>
    </div>

    <!-- 3. Photo & Slides Gallery Box -->
    <div>
      <div class="flex justify-between items-center mb-2">
        <label class="text-xs font-bold text-slate-700 uppercase flex items-center gap-1.5">
          <i class="fa-solid fa-images text-emerald-500"></i> Photos & Sermon Slides
        </label>
        <label class="cursor-pointer inline-flex items-center gap-1.5 px-3 py-1 bg-sky-50 text-faith-700 border border-sky-200 rounded-lg text-xs font-bold hover:bg-sky-100 transition">
          <i class="fa-solid fa-cloud-arrow-up"></i> Upload Photo
          <input type="file" id="boardImageUploader" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
        </label>
      </div>

      <!-- Photo Grid -->
      <div id="boardPhotoGallery" class="grid grid-cols-3 sm:grid-cols-4 gap-3 min-h-[80px] p-3 bg-slate-50 border border-dashed border-slate-200 rounded-2xl items-center">
        <!-- Photos dynamically injected -->
      </div>
    </div>

  </div>

  <!-- Modal Footer -->
  <div class="px-6 py-3.5 bg-slate-50 border-t border-slate-100 flex justify-between items-center">
    <span class="text-xs text-slate-400 italic">Auto-syncs changes to Supabase cloud.</span>
    <button onclick="saveAndCloseBoard()" class="px-5 py-2 text-sm font-semibold text-white bg-faith-600 hover:bg-faith-700 rounded-xl shadow-sm transition">
      Save & Close
    </button>
  </div>

</div>
